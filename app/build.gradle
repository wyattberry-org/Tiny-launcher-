plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiny.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.tiny.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 100% Pure Java - Zero Kotlin Dependencies
}
