plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiny.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.tiny.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "tinylauncher"
            keyAlias "tinylauncher"
            keyPassword "tinylauncher"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 100% Pure Java - Zero Dependencies
}
