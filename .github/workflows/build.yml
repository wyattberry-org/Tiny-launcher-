name: Build TinyLauncher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK (Signed with Debug Key)
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK Output
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TinyLauncher.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TinyLauncher v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/TinyLauncher.apk
