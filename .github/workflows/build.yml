name: Build TinyLauncher Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias tinylauncher -keyalg RSA -keysize 2048 -validity 10000 -storepass tinylauncher -keypass tinylauncher -dname "CN=TinyLauncher, OU=Dev, O=Tiny, L=City, S=State, C=US"

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK Output
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TinyLauncher.apk

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyLauncher-Release-APK
          path: app/build/outputs/apk/release/TinyLauncher.apk
