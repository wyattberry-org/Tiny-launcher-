plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiny.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.tiny.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.palette:palette:1.0.0' // Palette API for dynamic wallpaper accent colors!
}
